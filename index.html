<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESIS Inspection Wizard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;font-size:15px}
.header{background:#1b3a6b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;opacity:.9}
.header small{font-size:11px;opacity:.6;display:block;margin-top:2px}
.header-code{font-size:11px;opacity:.6}
.progress-wrap{background:#e2e8f0;height:4px}
.progress-bar{height:4px;background:#2563eb;transition:width .35s}
.step-meta{display:flex;justify-content:space-between;padding:8px 20px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b}
.step-meta strong{color:#1b3a6b;font-weight:600}
.content{padding:20px;max-width:720px;margin:0 auto;min-height:calc(100vh - 200px)}
.step-title{font-size:20px;font-weight:700;color:#1b3a6b;margin-bottom:6px}
.step-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.choice{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:18px 12px;cursor:pointer;text-align:center;transition:all .15s}
.choice:hover{border-color:#93c5fd;background:#eff6ff}
.choice.sel{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 3px #bfdbfe}
.choice-icon{font-size:26px;margin-bottom:8px}
.choice-label{font-size:13px;font-weight:600;color:#1e293b}
.choice-sub{font-size:11px;color:#94a3b8;margin-top:3px}
.field-group{margin-bottom:16px}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;color:#1e293b;min-height:44px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
textarea{min-height:80px;resize:vertical}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:500px){.two-col,.three-col{grid-template-columns:1fr}}
.toggle-row{display:flex;gap:8px}
.tb{flex:1;padding:10px 6px;border:1.5px solid #cbd5e1;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;color:#64748b;text-align:center;min-height:44px;transition:all .15s}
.tb:hover{background:#f8fafc}
.tb.y{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.tb.n{border-color:#dc2626;background:#fef2f2;color:#dc2626}
.tb.sel{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.area-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.area-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px}
.area-name{font-size:12px;font-weight:700;color:#475569;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.area-btns{display:flex;gap:6px}
.ab{flex:1;padding:7px 4px;border:1.5px solid #e2e8f0;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;background:#fff;color:#94a3b8;text-align:center}
.ab:hover{background:#f1f5f9}
.ab.ok{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.ab.vio{border-color:#dc2626;background:#fef2f2;color:#dc2626}
.ab.na{border-color:#94a3b8;background:#f1f5f9;color:#64748b}
.section-head{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;padding:8px 0 6px;border-bottom:1px solid #f1f5f9;margin-bottom:8px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;margin-bottom:12px;letter-spacing:.04em}
.badge-annual{background:#dbeafe;color:#1d4ed8}
.badge-test{background:#fef3c7;color:#92400e}
.test-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f8fafc}
.test-code{font-family:monospace;font-size:10px;color:#94a3b8;min-width:90px;flex-shrink:0}
.test-label{flex:1;font-size:13px;color:#334155;line-height:1.4}
.test-ref{font-size:10px;color:#cbd5e1}
.test-btns{display:flex;gap:3px;flex-shrink:0}
.tbtn{padding:5px 8px;border:1.5px solid #e2e8f0;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;background:#fff;color:#94a3b8;min-width:32px;text-align:center}
.tbtn.P{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.tbtn.F{border-color:#dc2626;background:#fef2f2;color:#dc2626}
.tbtn.N{border-color:#f59e0b;background:#fffbeb;color:#92400e}
.tbtn.NT{border-color:#94a3b8;background:#f1f5f9;color:#64748b}
.tbtn.CT{border-color:#8b5cf6;background:#f5f3ff;color:#6d28d9}
.search-wrap{position:relative;margin-bottom:4px}
.code-dropdown{position:absolute;top:100%;left:0;right:0;z-index:200;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.code-opt{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.code-opt:hover{background:#f8fafc}
.code-opt:last-child{border-bottom:none}
.code-num{font-family:monospace;font-size:11px;font-weight:700;color:#2563eb}
.code-ttl{font-size:13px;font-weight:600;color:#1e293b}
.code-dsc{font-size:12px;color:#64748b;margin-top:1px;line-height:1.4}
.vio-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fef9f0;border:1px solid #fde68a;border-radius:8px;margin-bottom:6px}
.vio-code{font-family:monospace;font-size:12px;font-weight:700;color:#92400e;min-width:80px;padding-top:1px}
.vio-desc{flex:1;font-size:13px;color:#1e293b;line-height:1.4}
.vio-del{cursor:pointer;color:#dc2626;font-size:18px;line-height:1;flex-shrink:0;padding:0 2px}
.vio-del:hover{color:#7f1d1d}
.add-custom{margin-top:10px;display:flex;gap:8px}
.add-custom input{flex:1}
.btn-add{padding:10px 16px;background:#1b3a6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn-add:hover{background:#1e40af}
.sig-area{background:#fff;border:1.5px dashed #cbd5e1;border-radius:8px;padding:0;margin-bottom:10px;overflow:hidden}
.sig-canvas{display:block;width:100%;cursor:crosshair;touch-action:none}
.sig-actions{display:flex;gap:8px;margin-top:4px}
.btn-outline{padding:9px 16px;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#475569}
.btn-outline:hover{background:#f8fafc;border-color:#94a3b8}
.review-section{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px}
.review-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:10px}
.review-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #f8fafc}
.review-row:last-child{border-bottom:none}
.review-key{color:#64748b}
.review-val{font-weight:600;color:#1e293b;text-align:right;max-width:55%;word-break:break-word}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn-action{flex:1;min-width:140px;padding:14px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-print{background:#1b3a6b;color:#fff}
.btn-print:hover{background:#1e3a8a}
.btn-email{background:#15803d;color:#fff}
.btn-email:hover{background:#166534}
.nav{position:sticky;bottom:0;background:#f8fafc;border-top:1px solid #e2e8f0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.btn-back{padding:12px 20px;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:#475569;display:flex;align-items:center;gap:6px}
.btn-back:hover{background:#f1f5f9}
.btn-next{padding:12px 24px;background:#1b3a6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn-next:hover{background:#1e40af}
.btn-back:disabled,.btn-next:disabled{opacity:.35;cursor:not-allowed}
.notice{background:#fefce8;border:1px solid #fde047;border-radius:8px;padding:12px 14px;font-size:12px;color:#713f12;margin-bottom:14px;line-height:1.5}
.notice strong{display:block;font-size:13px;margin-bottom:2px}
@media print{.nav,.header,#action-btns{display:none!important}.content{padding:0;max-width:100%}}
</style>
</head>
<body>
<div class="header">
  <div><h1>ESIS Inspection Wizard</h1><small>Elevator Safety Inspection Services, Inc. · Hot Springs, AR</small></div>

<div class="content" id="content"></div>
<div class="nav">
  <button class="btn-back" id="btn-back" onclick="nav(-1)">← Back</button>
  <button class="btn-next" id="btn-next" onclick="nav(1)">Next →</button>
</div>

  {c:"A17.3-3.10.6",t:"Phase reversal and failure protection",d:"Elevators shall be provided with means to prevent starting or shall stop the elevator on reversal or failure of any phase of a multi-phase power supply"},
  {c:"A17.3-3.10.7",t:"Auxiliary lowering means (hydraulic not applicable)",d:"Means shall be provided for emergency lowering of the car in the event of power failure"},

  {c:"A17.3-4.2.3",t:"Hydraulic car enclosures",d:"Car enclosures, doors, and gates shall conform to applicable requirements of Section 3; car safeties may be required per 4.9.6"},
  {c:"A17.3-4.2.4",t:"Hydraulic capacity and loading",d:"Capacity plate showing rated load and number of persons shall be posted in car; loading shall not exceed rated capacity"},
  {c:"A17.3-4.3.2",t:"Hydraulic plunger stops",d:"Plunger/piston shall be provided with a stop to prevent it from traveling beyond the upper limit of travel; stop shall withstand forces with oil at relief valve pressure"},

  {c:"A17.3-4.4.3",t:"Hydraulic control valves",d:"Mechanically controlled operating valves shall be of approved type; shall control car speed within required limits in both directions"},
  {c:"A17.3-4.4.4",t:"Supply piping and fittings",d:"Supply piping and fittings shall be in sound condition; pipe shall be Schedule 40 or heavier steel; no visible leakage permitted"},

  {c:"A17.3-4.7.4",t:"Hydraulic electrical protective devices",d:"Electrical protective devices required for hydraulic elevators shall be in place and functioning; includes pressure switches, low-oil, thermal protection"},
  {c:"A17.3-4.7.5",t:"Power supply line disconnecting means",d:"A means of disconnecting all ungrounded main power supply conductors from the hydraulic power unit shall be provided"},
  {c:"A17.3-4.7.8",t:"Hydraulic emergency operation and signaling",d:"Car shall have alarm and two-way communication; Phase I/II firefighters emergency operation as applicable; manual lowering means required"},

// ─── HELPERS ──────────────────────────────────────────────────
function updateProgress(){
  const pct=((currentStep)/(STEPS.length-1))*100;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('step-label').textContent=STEPS[currentStep].label;
  document.getElementById('step-count').textContent='Step '+(currentStep+1)+' of '+STEPS.length;
  document.getElementById('btn-back').disabled=currentStep===0;
  const isLast=currentStep===STEPS.length-1;
  const nb=document.getElementById('btn-next');
  nb.textContent=isLast?'':'Next →';
  if(isLast) nb.style.display='none'; else nb.style.display='';
}
function v(id){return(document.getElementById(id)||{}).value||''}
// Auto-save any named field directly to S as user types
function autoSave(id,val){
  const direct=['bldgName','address','location','city','state','zip','phone','ownerLessee','mailingAddress',
    'stateNum','bldgId','unitNum','yearInstalled','maintBy','expMo','expYear',
    'inspDate','inspSignature','arkLic','contacted','billingEmail','billingFax',
    'testNotes','jackDia','noLoadPressure','jackArea','carWeight','capacity','ratedWP','custSigName'];
  if(direct.includes(id)) S[id]=val;
}
function fld(lbl,id,val,ph,type='text',required=false,extraAttrs=''){
  return`<div class="field-group"><label>${lbl}${required?' *':''}</label><input type="${type}" id="${id}" value="${(val||'').toString().replace(/"/g,'&quot;')}" placeholder="${ph||''}" oninput="autoSave('${id}',this.value)" ${extraAttrs}></div>`;
}
function saveCurrentStep(){
  // Always try to save every known text field from the DOM, regardless of step.
  // If the element isn't rendered right now, getElementById returns null and we skip it.
  // This prevents any field from ever being missed.
  [
    'bldgName','address','location','city','state','zip','phone','ownerLessee','mailingAddress',
    'stateNum','bldgId','unitNum','yearInstalled','maintBy','expMo','expYear',
    'inspDate','inspSignature','arkLic','contacted','billingEmail','billingFax',
    'testNotes','jackDia','noLoadPressure','jackArea','carWeight','capacity','ratedWP',
  ].forEach(id=>{const el=document.getElementById(id);if(el)S[id]=el.value;});
}
function nav(dir){
  saveCurrentStep();
  let next=currentStep+dir;
  if(next<0)return;
  // Skip config step for non-elevator equipment
  if(STEPS[next]&&STEPS[next].id==='config'&&S.equipType!=='elevator'&&S.equipType!=='escalator') next+=dir;
  // Skip test fields if annual inspection only
  if(STEPS[next]&&STEPS[next].id==='testfields'&&isAnnualOnly()) next+=dir;
  if(next>=STEPS.length)return;
  currentStep=next;
  render();
}

function isAnnualOnly(){
  return S.testType==='annual'||S.testType==='semi_annual';
}
function getTestItems(){
  const et=S.equipType,dt=S.driveType,tt=S.testType;
  if(et==='escalator'||et==='moving_walk') return tt==='5year'?[...ESC_ANNUAL,...ESC_5YR]:ESC_ANNUAL;
  if(dt==='hydraulic') return tt==='3year'||tt==='5year'?[...HYD_ANNUAL,...HYD_3YR]:HYD_ANNUAL;
  return tt==='5year'?[...ELEC_ANNUAL,...ELEC_5YR]:ELEC_ANNUAL;
}

function searchCodes(q){
  const dd=document.getElementById('codeDropdown');
  if(!q||q.length<2){dd.style.display='none';return;}
  const ql=q.toLowerCase();
  const edition=S.codeEdition||'both';
  let pool=[];
  if(edition==='a171'||edition==='both') pool=pool.concat(CODES.map(c=>({...c,_src:'A17.1'})));
  if(edition==='a173'||edition==='both') pool=pool.concat(CODES_A173.map(c=>({...c,_src:'A17.3'})));

  // Check if query matches a section heading — if so, return all codes under that section
  const secMatch=(edition==='a171'||edition==='both'?SECTION_INDEX:SECTION_INDEX.filter(s=>s.src==='A17.3'))
    .filter(s=>(edition==='a171'&&s.src==='A17.1')||(edition==='a173'&&s.src==='A17.3')||(edition==='both'))
    .find(s=>s.keys.some(k=>k.includes(ql)||ql.includes(k))||s.title.toLowerCase().includes(ql)||s.prefix.toLowerCase().includes(ql));

  let res;
  if(secMatch){
    // Show all codes under matched section
    res=pool.filter(c=>c.c.startsWith(secMatch.prefix));
    // Prefix with section header entry
    const hdr={c:secMatch.prefix+'.*',t:secMatch.title,d:'Showing all codes in this section — click any to add',_src:secMatch.src,_header:true};
    res=[hdr,...res.slice(0,20)];
  } else {
    res=pool.filter(c=>c.c.toLowerCase().includes(ql)||c.t.toLowerCase().includes(ql)||c.d.toLowerCase().includes(ql)).slice(0,14);
  }

  if(!res.length){dd.style.display='none';return;}
  const srcColor={'A17.1':'#1d4ed8','A17.3':'#7c3aed'};
  dd.innerHTML=res.map(c=>c._header
    ?`<div style="padding:7px 12px;background:#f8fafc;border-bottom:2px solid #e2e8f0;font-size:11px;font-weight:700;color:#475569;letter-spacing:.04em;text-transform:uppercase">
        ${c.t} <span style="color:#94a3b8;font-weight:400">(${res.length-1} codes)</span></div>`
    :`<div class="code-opt" onclick="selectCode('${c.c.replace(/'/g,"\\'")}','${c.t.replace(/'/g,"\\'")}','${c.d.replace(/'/g,"\\'")}')">
    <div><span class="code-num" style="color:${srcColor[c._src]}">${c.c}</span>
    <span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;background:${c._src==='A17.1'?'#dbeafe':'#ede9fe'};color:${srcColor[c._src]};margin-left:4px">${c._src}</span>
    <span class="code-ttl"> ${c.t}</span></div>
    <div class="code-dsc">${c.d.substring(0,100)}${c.d.length>100?'…':''}</div>
  </div>`).join('');
  dd.style.display='block';
}

let sigDrawing=false,sigLast=null,sigCtx=null;
let custSigDrawing=false,custSigLast=null,custSigCtx=null;

function initSigCanvas(canvasId, isCustomer){
  const c=document.getElementById(canvasId);if(!c)return null;
  c.width=c.parentElement.offsetWidth||600;
  const ctx=c.getContext('2d');
  ctx.strokeStyle='#1e293b';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,last=null;
  const drawLine=(p)=>{if(!last)return;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const save=()=>{if(isCustomer)S.custSigData=c.toDataURL();else S.sigData=c.toDataURL();};
  c.addEventListener('mousedown',e=>{drawing=true;last=pos(e,c)},false);
  c.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e,c);drawLine(p);last=p;},false);
  c.addEventListener('mouseup',e=>{drawing=false;save();},false);
  c.addEventListener('mouseleave',e=>{drawing=false;save();},false);
  c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;last=pos(e.touches[0],c);},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e.touches[0],c);drawLine(p);last=p;},{passive:false});
  c.addEventListener('touchend',e=>{drawing=false;save();},false);
  return ctx;
}
function initSig(){
  sigCtx=initSigCanvas('sigCanvas',false);
  custSigCtx=initSigCanvas('custSigCanvas',true);
}
function pos(e,c){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function clearSig(){
  const c=document.getElementById('sigCanvas');
  if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
  S.sigData=null;render();
}
function clearCustSig(){
  const c=document.getElementById('custSigCanvas');
  if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
  S.custSigData=null;render();
}

// ─── PRINT, DOWNLOAD & EMAIL ──────────────────────────────────
function openReportBlob(autoPrint){
  const html=buildReportHTML();
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){
    if(autoPrint) w.addEventListener('load',()=>{setTimeout(()=>{w.print();},400);});
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  } else {
    // Popup blocked — fall back to download
    downloadReport();
  }
}
function printReport(){ openReportBlob(true); }
function viewReport(){ openReportBlob(false); }
function downloadReport(){
  const html=buildReportHTML();
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const bldg=(S.bldgName||'report').replace(/[^a-z0-9]/gi,'_').replace(/_+/g,'_');
  const dt=(S.inspDate||new Date().toLocaleDateString()).replace(/\//g,'-');
  a.download=`ESIS_Inspection_${bldg}_${dt}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function emailReport(){
  const lines=[
    'ESIS INSPECTION REPORT',
    '=======================',
    `Inspector: ${S.inspSignature||''}  |  Ark Lic: ${S.arkLic||''}`,
    `Date: ${S.inspDate||''}`,
    '',
    `Building: ${S.bldgName||''}`,
    `Address: ${[S.address,S.city,S.state,S.zip].filter(Boolean).join(', ')}`,
    `Owner/Lessee: ${S.ownerLessee||''}`,
    `Phone: ${S.phone||''}`,
    '',
    `Equipment: ${[S.equipType,S.driveType,S.passFrt==='pass'?'Passenger':S.passFrt==='frt'?'Freight':''].filter(Boolean).join(' / ')}`,
    `State #: ${S.stateNum||''}  |  Unit: ${S.unitNum||''}`,
    `Inspection type: ${S.testType||''}`,
    `Overall result: ${(S.testResult||'').toUpperCase()}`,
    '',
    'AREA RATINGS:',
    ...getRelevantAreas().map(a=>`  ${a.label}: ${(S.areas[a.key]||'—').toUpperCase()}`),
    '',
    'DEFICIENCIES:',
    ...(S.violations.length?S.violations.map(v=>`  ${v.code}  —  ${v.desc}${v.note?' ['+v.note+']':''}`):['  None noted']),
    '',
    `Maintained by: ${S.maintBy||''}`,
    `Permit posted: ${S.permitPosted||''}  |  Exp: ${S.expMo||''}/${S.expYear||''}`,
    '',
    '-- Sent from ESIS Inspection Wizard --',
  ];
  const body=encodeURIComponent(lines.join('\n'));
  const subj=encodeURIComponent(`Inspection Report — ${S.bldgName||'Building'} — ${S.inspDate||''}`);
  window.location.href=`mailto:esis@elevatorsafetyinspection.net?subject=${subj}&body=${body}`;
}

// ─── MAIN RENDER ──────────────────────────────────────────────
const renderers={
  equip:renderEquip,config:renderConfig,testtype:renderTestType,
  building:renderBuilding,equipment:renderEquipmentDetails,inspector:renderInspector,
  areas:renderAreas,testfields:renderTestItems,violations:renderViolations,
  signature:renderSignature,review:renderReview,
};
function render(){
  const step=STEPS[currentStep];
  document.getElementById('content').innerHTML=renderers[step.id]();
  updateProgress();
  if(step.id==='signature') setTimeout(initSig,50);
  if(step.id==='violations'){
    document.addEventListener('click',function closeDD(e){
      if(!e.target.closest('.search-wrap')){
        const dd=document.getElementById('codeDropdown');
        if(dd)dd.style.display='none';
      }
    },{once:true});
  }
  window.scrollTo(0,0);
}
render();
</script>
